<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aprender a Brincar</title>
    <style>
        :root{
            --coral:#FF6B6B; --teal:#00C2B8; --sun:#FFD23F; --purple:#8E7CFF;
            --sky1:#BEE7FF; --sky2:#EAF7FF; --ink:#2b3a4a; --good:#4CC36B;
        }
        *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
        html,body{height:100%;}
        body{
            margin:0; font-family:'Comic Sans MS','Baloo 2','Segoe UI',sans-serif;
            color:var(--ink); overflow:hidden; touch-action:manipulation;
            background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 100%);
            text-align:center; user-select:none;
        }

        /* ---------- Ecrãs ---------- */
        .screen{position:fixed; inset:0; display:none; flex-direction:column;
            align-items:center; justify-content:center; padding:16px;}
        .screen.active{display:flex; animation:fadeIn .35s ease;}
        @keyframes fadeIn{from{opacity:0; transform:scale(.98);} to{opacity:1; transform:scale(1);}}

        /* ---------- Arranque ---------- */
        #start .cloud{font-size:1.1rem; color:#5a6b7a;}
        #start h1{font-size:2.4rem; margin:8px 0 4px; color:var(--ink); text-shadow:0 2px 0 #fff;}
        #start-btn{
            margin-top:26px; padding:26px 54px; font-size:2rem; font-weight:bold;
            color:#fff; background:var(--coral); border:none; border-radius:40px; cursor:pointer;
            box-shadow:0 8px 0 #d94f4f, 0 14px 24px rgba(217,79,79,.35);
            animation:bob 1.6s ease-in-out infinite;
        }
        #start-btn:active{transform:translateY(6px); box-shadow:0 2px 0 #d94f4f;}
        @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}

        /* ---------- Menu ---------- */
        #menu h1{font-size:2rem; margin:0 0 4px; text-shadow:0 2px 0 #fff;}
        #menu p{margin:0 0 20px; color:#5a6b7a; font-size:1.05rem;}
        .cards{display:flex; gap:20px; flex-wrap:wrap; justify-content:center; align-items:stretch; max-width:920px;}
        .card{
            width:250px; max-width:42vw; min-width:180px; background:#fff; border-radius:28px;
            padding:20px 16px 22px; cursor:pointer; border:5px solid #fff;
            box-shadow:0 10px 0 rgba(0,0,0,.10), 0 16px 30px rgba(0,0,0,.12);
            transition:transform .15s ease; display:flex; flex-direction:column; align-items:center;
        }
        .card:active{transform:translateY(6px) scale(.98);}
        .card .art{width:120px; height:120px; margin-bottom:6px;}
        .card .art svg{width:100%; height:100%; display:block;}
        .card .name{font-size:1.35rem; font-weight:bold; margin-top:6px;}
        .card .sub{font-size:.9rem; color:#7a8794;}
        .card.c1{border-color:var(--teal);}   .card.c1 .name{color:var(--teal);}
        .card.c2{border-color:var(--coral);}  .card.c2 .name{color:var(--coral);}
        .card.c3{border-color:var(--purple);} .card.c3 .name{color:var(--purple);}

        /* ---------- Botões flutuantes ---------- */
        .home-btn,.ear-btn{
            position:fixed; top:14px; z-index:50; width:62px; height:62px; border:none;
            border-radius:50%; font-size:1.7rem; cursor:pointer; color:#fff;
            display:flex; align-items:center; justify-content:center;
            box-shadow:0 5px 0 rgba(0,0,0,.18);
        }
        .home-btn{left:14px; background:var(--coral);}
        .ear-btn{right:14px; background:var(--teal);}
        .home-btn:active,.ear-btn:active{transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.18);}

        .game-title{position:fixed; top:22px; left:50%; transform:translateX(-50%);
            font-size:1.3rem; font-weight:bold; color:var(--ink); text-shadow:0 2px 0 #fff; z-index:40;}

        /* ---------- Jogo Sílabas ---------- */
        #g-syl .stage{display:flex; flex-direction:column; align-items:center; gap:18px; width:100%; max-width:460px;}
        #syl-random{padding:14px 26px; font-size:1.15rem; font-weight:bold; color:#fff;
            background:var(--purple); border:none; border-radius:18px; box-shadow:0 5px 0 #6b5ad1;}
        #syl-random:active{transform:translateY(4px); box-shadow:0 1px 0 #6b5ad1;}
        .machine{position:relative; width:92%; max-width:400px; height:210px; background:#37474F;
            border-radius:32px; border:10px solid #263238; display:flex; align-items:center;
            justify-content:center; box-shadow:inset 0 0 24px #000, 0 10px 24px rgba(0,0,0,.25);}
        .machine::before,.machine::after{content:""; position:absolute; top:-24px; width:16px; height:16px;
            border-radius:50%; background:#263238;}
        .machine::before{left:60px; box-shadow:0 -10px 0 -2px #263238;}
        .machine::after{right:60px; box-shadow:0 -10px 0 -2px #263238;}
        .consonant{font-size:6.5rem; font-weight:900; color:var(--teal); margin-right:12px;
            text-shadow:0 0 22px rgba(0,194,184,.8);}
        .drop{width:120px; height:150px; border:5px dashed rgba(255,255,255,.25); border-radius:22px;
            display:flex; align-items:center; justify-content:center; font-size:6.5rem; font-weight:900; color:var(--coral);}
        .drop.hot{border-color:var(--sun); background:rgba(255,210,63,.15);}
        .vowels{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; width:100%;}
        .vowel{width:72px; height:72px; background:var(--coral); border-radius:18px; display:flex;
            align-items:center; justify-content:center; font-size:2.6rem; font-weight:bold; color:#fff;
            box-shadow:0 5px 0 #d94f4f; cursor:grab;}
        #syl-result{position:fixed; top:26%; left:50%; transform:translate(-50%,-50%) scale(0);
            transition:.45s cubic-bezier(.2,1.4,.4,1); z-index:60; pointer-events:none; background:#fff;
            padding:16px 22px; border-radius:26px; box-shadow:0 12px 30px rgba(0,0,0,.25);}
        #syl-result.show{transform:translate(-50%,-50%) scale(1);}
        #syl-result .ri{width:110px; height:110px; margin:0 auto;}
        #syl-result .ri svg{width:100%; height:100%;}
        #syl-result .ri .emoji{font-size:5rem; line-height:110px;}
        #syl-result .rt{font-size:2.4rem; font-weight:bold; color:var(--purple);}

        /* ---------- Jogos de escolha (Letras / Inglês) ---------- */
        .quiz{display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; max-width:640px;}
        .quiz .prompt{font-size:1.15rem; color:#5a6b7a; min-height:1.4em;}
        .bigart{width:200px; height:200px; background:#fff; border-radius:30px; padding:12px;
            box-shadow:0 10px 0 rgba(0,0,0,.08), 0 16px 30px rgba(0,0,0,.12);}
        .bigart svg{width:100%; height:100%;}
        .options{display:flex; gap:16px; flex-wrap:wrap; justify-content:center;}
        .opt-letter{width:96px; height:96px; border-radius:22px; background:var(--coral); color:#fff;
            font-size:3.4rem; font-weight:900; display:flex; align-items:center; justify-content:center;
            box-shadow:0 6px 0 #d94f4f; cursor:pointer;}
        .opt-letter:nth-child(2){background:var(--teal); box-shadow:0 6px 0 #008f88;}
        .opt-letter:nth-child(3){background:var(--purple); box-shadow:0 6px 0 #6b5ad1;}
        .opt-img{width:130px; height:130px; background:#fff; border-radius:24px; padding:8px; cursor:pointer;
            box-shadow:0 6px 0 rgba(0,0,0,.10); border:4px solid #fff;}
        .opt-img svg{width:100%; height:100%;}
        .opt-letter:active,.opt-img:active{transform:translateY(4px);}
        .shake{animation:shake .4s;}
        @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
        .pick-right{animation:pop .5s;}
        @keyframes pop{0%{transform:scale(1);}50%{transform:scale(1.18);}100%{transform:scale(1);}}

        /* ---------- Celebração ---------- */
        #cheer{position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center;
            pointer-events:none;}
        #cheer.show{display:flex;}
        #cheer .stars{font-size:5rem; animation:pop .6s;}
        .confetti{position:fixed; top:-20px; width:12px; height:12px; z-index:79; border-radius:3px; pointer-events:none;}
        @keyframes fall{to{transform:translateY(110vh) rotate(540deg); opacity:0;}}
    </style>
</head>
<body>

<!-- ============ ARRANQUE ============ -->
<section id="start" class="screen active">
    <div class="cloud">☁️ 🌈 ☁️</div>
    <h1>Aprender a Brincar</h1>
    <button id="start-btn">Toca para começar 👆</button>
</section>

<!-- ============ MENU ============ -->
<section id="menu" class="screen">
    <h1>Escolhe um jogo 🎈</h1>
    <p>Toca numa imagem</p>
    <div class="cards">
        <div class="card c1" data-go="g-syl" data-say="Máquina de sílabas">
            <div class="art" data-art="icoSyl"></div>
            <div class="name">Sílabas</div>
            <div class="sub">Junta letras e ouve</div>
        </div>
        <div class="card c2" data-go="g-let" data-say="Primeiras letras">
            <div class="art" data-art="icoLet"></div>
            <div class="name">Primeiras Letras</div>
            <div class="sub">Que letra começa?</div>
        </div>
        <div class="card c3" data-go="g-eng" data-say="Inglês">
            <div class="art" data-art="icoEng"></div>
            <div class="name">Inglês</div>
            <div class="sub">Aprende palavras novas</div>
        </div>
    </div>
</section>

<!-- ============ JOGO 1: SÍLABAS ============ -->
<section id="g-syl" class="screen">
    <button class="home-btn" data-home>🏠</button>
    <div class="game-title">Sílabas</div>
    <div id="syl-result"><div class="ri" id="syl-ri"></div><div class="rt" id="syl-rt"></div></div>
    <div class="stage">
        <button id="syl-random">Trocar letra 🎲</button>
        <div class="machine">
            <div class="consonant" id="syl-con">V</div>
            <div class="drop" id="syl-drop">?</div>
        </div>
        <div class="vowels">
            <div class="vowel" data-v="A">A</div>
            <div class="vowel" data-v="E">E</div>
            <div class="vowel" data-v="I">I</div>
            <div class="vowel" data-v="O">O</div>
            <div class="vowel" data-v="U">U</div>
        </div>
    </div>
</section>

<!-- ============ JOGO 2: PRIMEIRAS LETRAS ============ -->
<section id="g-let" class="screen">
    <button class="home-btn" data-home>🏠</button>
    <button class="ear-btn" id="let-ear">🔊</button>
    <div class="game-title">Primeiras Letras</div>
    <div class="quiz">
        <div class="prompt" id="let-prompt">Com que letra começa?</div>
        <div class="bigart" id="let-art"></div>
        <div class="options" id="let-opts"></div>
    </div>
</section>

<!-- ============ JOGO 3: INGLÊS ============ -->
<section id="g-eng" class="screen">
    <button class="home-btn" data-home>🏠</button>
    <button class="ear-btn" id="eng-ear">🔊</button>
    <div class="game-title">Inglês</div>
    <div class="quiz">
        <div class="prompt" id="eng-prompt">Ouve e escolhe a imagem certa</div>
        <div class="options" id="eng-opts"></div>
    </div>
</section>

<!-- ============ CELEBRAÇÃO ============ -->
<div id="cheer"><div class="stars">⭐⭐⭐</div></div>

/* =========================================================
   VOZ (PT-PT / Inglês)
   ========================================================= */
const synth = window.speechSynthesis;
let voices = [];
function loadVoices(){ voices = synth.getVoices(); }
loadVoices();
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;

function pickVoice(lang){
  if(lang.startsWith('pt'))
    return voices.find(v=>v.lang==='pt-PT'||v.lang==='pt_PT'||(v.lang.toLowerCase().startsWith('pt')&&/portugal/i.test(v.name)))
        || voices.find(v=>v.lang.toLowerCase().startsWith('pt'));
  return voices.find(v=>v.lang==='en-GB') || voices.find(v=>v.lang.toLowerCase().startsWith('en'));
}
function speak(text, lang='pt-PT', rate=0.72){
  if(!text) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(lang); if(v) u.voice=v;
  u.lang=lang; u.rate=rate; u.pitch=1.05;
  synth.speak(u);
}
/* fala vários pedaços em sequência (ex.: PT depois Inglês) */
function speakSeq(items){
  synth.cancel();
  let i=0;
  (function next(){
    if(i>=items.length) return;
    const it=items[i++];
    const u=new SpeechSynthesisUtterance(it.t);
    const v=pickVoice(it.l||'pt-PT'); if(v) u.voice=v;
    u.lang=it.l||'pt-PT'; u.rate=it.r||0.72; u.pitch=1.05;
    u.onend=()=>setTimeout(next,220);
    synth.speak(u);
  })();
}

/* =========================================================
   NAVEGAÇÃO ENTRE ECRÃS
   ========================================================= */
function showScreen(id){
  synth.cancel();
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='g-let') newLetterRound();
  if(id==='g-eng') newEnglishRound();
}

/* renderiza ilustrações marcadas com data-art */
document.querySelectorAll('[data-art]').forEach(el=>{ el.innerHTML = ART[el.dataset.art]||''; });

/* Arranque -> desbloqueia áudio e mostra o menu */
document.getElementById('start-btn').addEventListener('click', ()=>{
  speak('Olá! Vamos brincar.');
  showScreen('menu');
});

/* Cartões do menu */
document.querySelectorAll('.card').forEach(card=>{
  card.addEventListener('click', ()=>{
    speak(card.dataset.say);
    setTimeout(()=>showScreen(card.dataset.go), 550);
  });
});

/* Botões casa */
document.querySelectorAll('[data-home]').forEach(b=>{
  b.addEventListener('click', ()=>{ speak('Menu'); showScreen('menu'); });
});

/* =========================================================
   CELEBRAÇÃO (estrelas + confetti)
   ========================================================= */
function celebrate(){
  const c=document.getElementById('cheer');
  c.classList.add('show');
  const cols=['#FF6B6B','#FFD23F','#00C2B8','#8E7CFF','#4CC36B'];
  for(let i=0;i<18;i++){
    const p=document.createElement('div');
    p.className='confetti';
    p.style.left=Math.random()*100+'vw';
    p.style.background=cols[i%cols.length];
    p.style.animation=`fall ${1+Math.random()}s ease-in forwards`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),2000);
  }
  setTimeout(()=>c.classList.remove('show'),1200);
}

/* =========================================================
   JOGO 1 — MÁQUINA DE SÍLABAS (arrastar vogais)
   ========================================================= */
const CONS = ['B','D','F','G','L','M','N','P','R','S','T','V'];
const SYL = {
  B:{art:'bola'}, P:{art:'pato'}, M:{art:'maca'}, L:{art:'lua'}, F:{art:'flor'},
  S:{art:'sol'}, R:{art:'rato'}, V:{art:'vaca'}, G:{art:'gato'},
  D:{emoji:'🎲'}, N:{emoji:'🔢'}, T:{emoji:'🚂'}
};
let activeCon = 'V';

function phonetic(t){ return t.replace(/A/g,'Á').replace(/E/g,'É').replace(/O/g,'Ó'); }
function randomCon(){
  activeCon = CONS[Math.floor(Math.random()*CONS.length)];
  document.getElementById('syl-con').innerText = activeCon;
  speak('Letra '+activeCon);
}
document.getElementById('syl-random').addEventListener('click', randomCon);

let dragEl=null;
document.querySelectorAll('.vowel').forEach(card=>{
  card.addEventListener('touchstart', e=>{
    startDrag(card, e.touches[0]);
    speak('Letra '+phonetic(card.dataset.v));
  }, {passive:true});
  card.addEventListener('mousedown', e=>{ startDrag(card,e); speak('Letra '+phonetic(card.dataset.v)); });
});
function startDrag(card, pt){
  dragEl = card.cloneNode(true);
  Object.assign(dragEl.style,{position:'fixed', zIndex:1000, left:(pt.clientX-36)+'px', top:(pt.clientY-36)+'px', opacity:.95});
  dragEl.dataset.v = card.dataset.v;
  document.body.appendChild(dragEl);
}
function moveDrag(pt){
  if(!dragEl) return;
  dragEl.style.left=(pt.clientX-36)+'px'; dragEl.style.top=(pt.clientY-36)+'px';
  const d=document.getElementById('syl-drop').getBoundingClientRect();
  const over = pt.clientX>d.left&&pt.clientX<d.right&&pt.clientY>d.top&&pt.clientY<d.bottom;
  document.getElementById('syl-drop').classList.toggle('hot', over);
}
window.addEventListener('touchmove', e=>{ if(dragEl){ moveDrag(e.touches[0]); } }, {passive:true});
window.addEventListener('mousemove', e=>{ if(dragEl) moveDrag(e); });
function endDrag(pt){
  if(!dragEl) return;
  const drop=document.getElementById('syl-drop');
  const d=drop.getBoundingClientRect();
  drop.classList.remove('hot');
  if(pt.clientX>d.left&&pt.clientX<d.right&&pt.clientY>d.top&&pt.clientY<d.bottom){
    dropVowel(dragEl.dataset.v);
  }
  dragEl.remove(); dragEl=null;
}
window.addEventListener('touchend', e=>{ if(dragEl) endDrag(e.changedTouches[0]); });
window.addEventListener('mouseup', e=>{ if(dragEl) endDrag(e); });

function dropVowel(v){
  const drop=document.getElementById('syl-drop');
  const res=document.getElementById('syl-result');
  const info=SYL[activeCon]||{};
  drop.innerText=v;
  document.getElementById('syl-ri').innerHTML = info.art ? ART[info.art] : `<span class="emoji">${info.emoji||'✨'}</span>`;
  document.getElementById('syl-rt').innerText = activeCon+v;
  res.classList.add('show');
  speak(activeCon+phonetic(v));
  setTimeout(()=>{ res.classList.remove('show'); drop.innerText='?'; }, 2200);
}

/* =========================================================
   JOGO 2 — PRIMEIRAS LETRAS (que letra começa?)
   ========================================================= */
const LET_WORDS = [
  {k:'sol',w:'Sol',L:'S'}, {k:'lua',w:'Lua',L:'L'}, {k:'gato',w:'Gato',L:'G'},
  {k:'pato',w:'Pato',L:'P'}, {k:'bola',w:'Bola',L:'B'}, {k:'flor',w:'Flor',L:'F'},
  {k:'casa',w:'Casa',L:'C'}, {k:'maca',w:'Maçã',L:'M'}, {k:'peixe',w:'Peixe',L:'P'},
  {k:'estrela',w:'Estrela',L:'E'}, {k:'arvore',w:'Árvore',L:'A'}, {k:'vaca',w:'Vaca',L:'V'},
  {k:'rato',w:'Rato',L:'R'}
];
const LET_POOL = ['A','B','C','D','E','F','G','L','M','N','O','P','R','S','T','U','V'];
let letCurrent=null, letLast=-1;

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

function newLetterRound(){
  let idx; do{ idx=(Math.random()*LET_WORDS.length)|0; }while(idx===letLast&&LET_WORDS.length>1);
  letLast=idx; letCurrent=LET_WORDS[idx];
  document.getElementById('let-art').innerHTML = ART[letCurrent.k];
  const distract = shuffle(LET_POOL.filter(l=>l!==letCurrent.L)).slice(0,2);
  const opts = shuffle([letCurrent.L, ...distract]);
  const box = document.getElementById('let-opts'); box.innerHTML='';
  opts.forEach(l=>{
    const el=document.createElement('div'); el.className='opt-letter'; el.innerText=l; el.dataset.l=l;
    el.addEventListener('click', ()=>chooseLetter(el, l));
    box.appendChild(el);
  });
  setTimeout(()=>speakLetterPrompt(), 400);
}
function speakLetterPrompt(){
  speakSeq([{t:letCurrent.w, r:0.8}, {t:'Com que letra começa?', r:0.85}]);
}
document.getElementById('let-ear').addEventListener('click', speakLetterPrompt);

function chooseLetter(el, l){
  if(l===letCurrent.L){
    el.classList.add('pick-right');
    speakSeq([{t:'Boa!'}, {t:`${letCurrent.w} começa com a letra ${letCurrent.L}.`, r:0.75}]);
    celebrate();
    setTimeout(newLetterRound, 2600);
  } else {
    el.classList.add('shake');
    setTimeout(()=>el.classList.remove('shake'),450);
    speak('Quase! Tenta outra vez.', 'pt-PT', 0.8);
  }
}

/* =========================================================
   JOGO 3 — INGLÊS (ouve em inglês, escolhe a imagem)
   ========================================================= */
const ENG_WORDS = [
  {k:'gato',pt:'gato',en:'cat'}, {k:'cao',pt:'cão',en:'dog'}, {k:'sol',pt:'sol',en:'sun'},
  {k:'lua',pt:'lua',en:'moon'}, {k:'bola',pt:'bola',en:'ball'}, {k:'flor',pt:'flor',en:'flower'},
  {k:'casa',pt:'casa',en:'house'}, {k:'maca',pt:'maçã',en:'apple'}, {k:'peixe',pt:'peixe',en:'fish'},
  {k:'estrela',pt:'estrela',en:'star'}, {k:'arvore',pt:'árvore',en:'tree'}, {k:'vaca',pt:'vaca',en:'cow'},
  {k:'pato',pt:'pato',en:'duck'}, {k:'rato',pt:'rato',en:'mouse'}
];
let engCurrent=null, engLast=-1;

function newEnglishRound(){
  let idx; do{ idx=(Math.random()*ENG_WORDS.length)|0; }while(idx===engLast&&ENG_WORDS.length>1);
  engLast=idx; engCurrent=ENG_WORDS[idx];
  const others = shuffle(ENG_WORDS.filter(w=>w.k!==engCurrent.k)).slice(0,2);
  const opts = shuffle([engCurrent, ...others]);
  const box = document.getElementById('eng-opts'); box.innerHTML='';
  opts.forEach(w=>{
    const el=document.createElement('div'); el.className='opt-img'; el.innerHTML=ART[w.k]; el.dataset.k=w.k;
    el.addEventListener('click', ()=>chooseEnglish(el, w));
    box.appendChild(el);
  });
  setTimeout(()=>speakEnglishPrompt(), 400);
}
function speakEnglishPrompt(){
  speakSeq([{t:'Onde está...', r:0.85}, {t:engCurrent.en, l:'en-GB', r:0.8}]);
}
document.getElementById('eng-ear').addEventListener('click', speakEnglishPrompt);

function chooseEnglish(el, w){
  if(w.k===engCurrent.k){
    el.classList.add('pick-right');
    speakSeq([{t:'Boa!'}, {t:engCurrent.en, l:'en-GB', r:0.75}, {t:'é '+engCurrent.pt, r:0.8}]);
    celebrate();
    setTimeout(newEnglishRound, 2800);
  } else {
    el.classList.add('shake');
    setTimeout(()=>el.classList.remove('shake'),450);
    speakSeq([{t:'Tenta outra vez.', r:0.8}, {t:engCurrent.en, l:'en-GB', r:0.8}]);
  }
}
